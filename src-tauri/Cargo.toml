[package]
name = "secret-treasure"
version = "0.8.5"
description = "Secret Treasure — Linux desktop shell (Tauri 2)"
authors = ["Relatedguy"]
edition = "2021"

[lib]
name = "secret_treasure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# linuxdeploy's bundled strip cannot parse RELR sections on Arch/Manjaro.
# Leave symbols; the AppImage tool strips later when NO_STRIP is unset.
strip = false
