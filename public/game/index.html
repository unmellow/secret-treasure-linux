<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Secret Treasure (offline fork)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #231f20;
        overflow: hidden;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unityContainer {
        width: 996px;
        height: 666px;
        transform-origin: center center;
        flex: none;
      }
      #unityContainer canvas {
        display: block;
        width: 996px !important;
        height: 666px !important;
      }
    </style>
    <script src="clicks.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script src="fork.js"></script>
  </head>
  <body>
    <div id="stage">
      <div id="unityContainer"></div>
    </div>
    <script>
      var gameInstance = UnityLoader.instantiate(
        "unityContainer",
        "Build/build.json"
      );
      if (window.SecretTreasureFork) {
        SecretTreasureFork.attachUnity(gameInstance);
      }
      if (window.stFitGame) window.stFitGame();

      function unlockAudio() {
        try {
          if (
            typeof WEBAudio !== "undefined" &&
            WEBAudio.audioContext &&
            WEBAudio.audioContext.resume
          ) {
            WEBAudio.audioContext.resume();
          }
        } catch (e) {}
      }
      window.addEventListener("pointerdown", unlockAudio, true);
      window.addEventListener("keydown", unlockAudio, true);
    </script>
  </body>
</html>
